          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            const cx = e.clientX;
            const cy = e.clientY;
            quickSetters.forEach((setter) => {

            });

          if (rafId) cancelAnimationFrame(rafId);

      const handlePerspectiveTilt = useCallback((e, cardElement, maxRotation = 10) => {

        const gsap = window.gsap;
        const rect = cardElement.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const xPercent = (x / rect.width - 0.5) * 2;
        const yPercent = (y / rect.height - 0.5) * 2;

        gsap.to(cardElement, {
          rotateX: -yPercent * maxRotation,
          rotateY: xPercent * maxRotation,
          transformPerspective: 1000,
          transformOrigin: "center center",
          scale: 1.015,
          duration: 0.25,
          ease: "power1.out",

                <p className="text-rose-300 font-medium italic text-base">
                  &ldquo;With you, my world is complete. Without you, nothing feels right.&rdquo;
                </p>
              </section>

              {/* Section 5: Closing & Call to Action */}
              <section className="text-center w-full max-w-xl mt-10 flex flex-col items-center">
                <p className="text-rose-300/80 text-sm tracking-widest uppercase font-semibold mb-2">
                  Waiting for you with all my heart
                </p>
                <div className="text-2xl sm:text-3xl font-serif text-rose-200 mb-8 tracking-wide">
                  — aapka Krish
                </div>

                {/* Glowing Rose Pink Button */}
                <button
                  onClick={() => setModalOpen(true)}
                  className="relative group px-10 py-4 rounded-full font-bold text-lg text-white bg-gradient-to-r from-rose-600 via-rose-500 to-pink-600 shadow-[0_0_35px_rgba(244,63,94,0.65)] hover:shadow-[0_0_55px_rgba(244,63,94,0.95)] hover:scale-105 active:scale-95 transition-all duration-300 cursor-pointer border border-rose-300/40"
                >
                  <span className="flex items-center gap-3">
                    <span className="text-xl group-hover:animate-bounce">💌</span>
                    <span>Wapas Aa Jaiye</span>
                    <span className="text-xl group-hover:animate-pulse">✨</span>
                  </span>
                </button>
              </section>
            </main>
          )}

          {/* ================= FULL DIARY NOTE MODAL ================= */}
          {selectedNote && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-in fade-in duration-300">
              <div className="relative w-full max-w-2xl max-h-[85vh] overflow-y-auto p-7 sm:p-9 rounded-3xl bg-gradient-to-b from-[#1b0833] via-[#120424] to-[#0a0216] border border-rose-500/40 shadow-[0_0_60px_rgba(244,63,94,0.45)] text-left">
                <div className="flex items-center justify-between pb-4 border-b border-rose-500/20 mb-5">
                  <div>
                    <span className="text-xs text-rose-400 font-mono tracking-widest uppercase block mb-1">
                      🗓️ Published: {selectedNote.date}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold text-rose-100">
                      {selectedNote.title}
                    </h3>
                  </div>
                  <button
                    onClick={() => setSelectedNote(null)}
                    className="w-9 h-9 rounded-full bg-rose-950/70 border border-rose-500/30 text-rose-300 hover:text-white hover:bg-rose-600 flex items-center justify-center text-lg transition-all"
                    aria-label="Close Note"
                  >
                    ✕
                  </button>
                </div>

                <div className="text-rose-200/90 text-sm sm:text-base leading-relaxed font-light whitespace-pre-line space-y-4 pr-1">
                  {selectedNote.content}
                </div>

                <div className="mt-8 pt-4 border-t border-rose-500/20 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <span className="text-xs text-rose-400/60 font-serif italic">
                    From Krish's private notepad • Written for Akanksha
                  </span>
                  <button
                    onClick={() => setSelectedNote(null)}
                    className="px-6 py-2 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-medium text-xs sm:text-sm transition-all shadow-md active:scale-95"
                  >
                    Close Note 🌹
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Heartfelt Confirmation Modal */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all">
              <div className="relative w-full max-w-md p-8 sm:p-9 rounded-3xl bg-gradient-to-b from-[#1c0a36] to-[#0c0317] border border-rose-500/50 shadow-[0_0_60px_rgba(244,63,94,0.5)] text-center animate-in fade-in zoom-in-95 duration-300">
                <div className="text-5xl mb-4 animate-bounce">💖</div>
                <h4 className="text-2xl font-bold text-rose-100 mb-3">
                  Thank You, Akanksha!
                </h4>
                <p className="text-rose-200/90 text-sm sm:text-base leading-relaxed mb-6 font-light">
                  Every breath, every prayer, and every dream of mine waits only for you.
                  Krish was yours, is yours, and will always be yours forever.
                </p>
                <button
                  onClick={() => setModalOpen(false)}
                  className="w-full py-3 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-semibold transition-all shadow-[0_0_20px_rgba(244,63,94,0.5)] active:scale-95"
                >
                  With All My Love 🌹
                </button>
              </div>
            </div>
          )}

          {/* Subtle Footer */}
          <footer className="relative z-20 text-center py-6 text-xs text-rose-400/40">
            Created by Krish with utmost love, sincerity, and hope.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ApologyWebsite />);
  </script>
</body>
</html>

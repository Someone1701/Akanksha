                  My Dearest Akanksha
                </h1>

                <p className="text-base sm:text-xl text-rose-200/80 font-light leading-relaxed max-w-2xl px-2">
                  Life without you feels colorless and silent. From the deepest corners
                  of my soul, I offer you my most sincere apology. My days and nights
                  only hold meaning when they carry your thoughts.
                </p>
              </section>

              {/* Section 1: Hindi Quote Cards */}
              <section className="w-full my-8">
                <div className="text-center mb-10">
                  <span className="text-rose-400 text-xs sm:text-sm font-semibold tracking-widest uppercase">
                    Feelings I Carry Every Day
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-bold text-rose-100 mt-1 mb-2">
                    Words Straight From My Soul
                  </h2>
                  <div className="h-0.5 w-24 bg-gradient-to-r from-transparent via-rose-500 to-transparent mx-auto" />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                  {quotes.map((quote, index) => (
                    <div
                      key={index}
                      ref={(el) => (quotesRef.current[index] = el)}
                      onMouseMove={(e) => handlePerspectiveTilt(e, e.currentTarget, 10)}
                      onMouseLeave={(e) => handleTiltReset(e.currentTarget)}
                      style={{ transformStyle: "preserve-3d" }}
                      className="relative group p-7 sm:p-8 rounded-2xl bg-gradient-to-b from-[#160829]/90 to-[#0e041d]/90 border border-rose-500/20 hover:border-rose-400/60 transition-shadow duration-300 shadow-[0_10px_30px_rgba(0,0,0,0.5)] hover:shadow-[0_0_35px_rgba(244,63,94,0.3)] backdrop-blur-md overflow-hidden cursor-default"
                    >
                      <div className="card-gloss absolute -inset-full bg-gradient-to-r from-transparent via-rose-400/10 to-transparent pointer-events-none opacity-0" />

                      <div className="absolute top-4 right-5 text-2xl opacity-70 group-hover:scale-125 transition-transform duration-300">
                        {quote.icon}
                      </div>

                      <div className="text-rose-500/40 text-4xl font-serif leading-none select-none mb-1">
                        &ldquo;
                      </div>

                      <h3 className="text-xl sm:text-2xl font-semibold text-rose-100 group-hover:text-rose-300 transition-colors duration-300 leading-snug mb-3 pr-6">
                        {quote.hindi}
                      </h3>

                      <p className="text-sm sm:text-base text-rose-200/70 leading-relaxed font-light">
                        {quote.english}
                      </p>

                      <div className="mt-5 flex items-center gap-2">
                        <span className="h-1 w-8 rounded-full bg-rose-500/50 group-hover:w-14 transition-all duration-300" />
                        <span className="text-[11px] uppercase tracking-wider text-rose-400/80 font-medium">
                          {quote.tag}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* Section 2: "What You Always Asked Me" (Chronological Diary Notes) */}
              <section className="w-full my-12">
                <div className="text-center mb-10">
                  <span className="text-rose-400 text-xs sm:text-sm font-semibold tracking-widest uppercase">
                    Chronological Personal Diary • September & October 2026
                  </span>
                  <h2 className="text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-100 via-rose-200 to-pink-300 mt-1 mb-2">
                    What You Always Asked Me
                  </h2>
                  <p className="text-rose-300/80 text-sm sm:text-base max-w-2xl mx-auto px-4 font-light">
                    Aap humesha kehti thi ki aapke liye kuch kyu nahi banata, ya main kya chhupa raha hoon.
                    These are the unvarnished notes I wrote in silent solitude on my darkest nights, ordered by the date they were written.
                  </p>
                  <div className="h-0.5 w-32 bg-gradient-to-r from-transparent via-rose-500 to-transparent mx-auto mt-4" />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {diaryNotes.map((note, index) => (
                    <div
                      key={note.id}
                      ref={(el) => (diaryCardsRef.current[index] = el)}
                      onMouseMove={(e) => handlePerspectiveTilt(e, e.currentTarget, 10)}
                      onMouseLeave={(e) => handleTiltReset(e.currentTarget)}
                      style={{ transformStyle: "preserve-3d" }}
                      className="relative group p-6 sm:p-7 rounded-2xl bg-gradient-to-b from-[#17072d]/85 via-[#100322]/90 to-[#0a0216]/95 border border-rose-500/25 hover:border-rose-400/60 shadow-[0_10px_28px_rgba(0,0,0,0.5)] hover:shadow-[0_0_35px_rgba(244,63,94,0.3)] backdrop-blur-md transition-shadow duration-300 flex flex-col justify-between overflow-hidden cursor-default"
                    >
                      <div className="card-gloss absolute -inset-full bg-gradient-to-r from-transparent via-rose-400/10 to-transparent pointer-events-none opacity-0" />

                      <div>
                        {/* Date Badge & Photo indicator */}
                        <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
                          <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-950/70 border border-rose-500/30 text-rose-300 text-xs font-semibold tracking-wide">
                            <span>🗓️</span> {note.date}
                          </span>
                          {note.images && note.images.length > 0 && (
                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-rose-500/20 border border-rose-400/40 text-[11px] text-rose-200 font-medium">
                              <span>📷</span> {note.images.length === 1 ? "1 Image" : `${note.images.length} Images`}
                            </span>
                          )}
                        </div>

                        {/* Image Preview Banner if note has images */}
                        {note.images && note.images.length > 0 && (
                          <div
                            onClick={() => setSelectedNote(note)}
                            className="relative mb-3.5 h-36 rounded-xl overflow-hidden border border-rose-500/30 bg-black/40 group/thumb cursor-pointer shadow-inner"
                          >
                            <img
                              src={note.images[0].url}
                              alt={note.images[0].caption || note.title}
                              className="w-full h-full object-cover transition-transform duration-500 group-hover/thumb:scale-105"
                              loading="lazy"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent" />
                            <span className="absolute bottom-2 left-2.5 right-2.5 text-[11px] text-rose-200/90 font-medium truncate flex items-center justify-between">
                              <span>{note.images[0].caption || "Attached Screenshot"}</span>
                              <span className="text-rose-300 font-bold text-xs">View ↗</span>
                            </span>
                          </div>
                        )}

                        <h3 className="text-lg sm:text-xl font-bold text-rose-100 group-hover:text-rose-300 transition-colors duration-300 mb-2.5">
                          {note.title}
                        </h3>

                        <p className="text-xs sm:text-sm text-rose-200/70 leading-relaxed font-light italic mb-5 line-clamp-3">
                          &ldquo;{note.excerpt}&rdquo;
                        </p>
                      </div>

                      <button
                        onClick={() => setSelectedNote(note)}
                        className="w-full mt-2 py-2.5 px-4 rounded-xl bg-rose-950/50 hover:bg-rose-600/80 border border-rose-500/30 hover:border-rose-400 text-rose-200 hover:text-white text-xs font-semibold tracking-wide transition-all duration-300 flex items-center justify-center gap-2 group-hover:shadow-[0_0_20px_rgba(244,63,94,0.4)]"
                      >
                        <span>Read Full Note & Media</span>
                        <span className="text-sm">📖</span>
                      </button>
                    </div>
                  ))}
                </div>
              </section>

              {/* Section 3: Responsive Photo Grid with 3D Tilt */}
              <section className="w-full my-12">
                <div className="text-center mb-10">
                  <span className="text-rose-400 text-xs sm:text-sm font-semibold tracking-widest uppercase">
                    Treasured Moments
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-bold text-rose-100 mt-1 mb-2">
                    Our Beautiful Memories
                  </h2>
                  <p className="text-rose-300/70 text-sm sm:text-base max-w-xl mx-auto">
                    These are not merely pictures; they are proof of the purest happiness I have ever known.
                  </p>
                  <div className="h-0.5 w-24 bg-gradient-to-r from-transparent via-rose-500 to-transparent mx-auto mt-3" />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {photos.map((item, index) => (
                    <div
                      key={index}
                      ref={(el) => (photosRef.current[index] = el)}
                      onMouseMove={(e) => handlePerspectiveTilt(e, e.currentTarget, 10)}
                      onMouseLeave={(e) => handleTiltReset(e.currentTarget)}
                      style={{ transformStyle: "preserve-3d" }}
                      className={`group relative overflow-hidden rounded-2xl bg-[#140726] border border-rose-500/20 hover:border-rose-400/60 shadow-[0_12px_28px_rgba(0,0,0,0.6)] transition-all duration-500 hover:shadow-[0_0_30px_rgba(244,63,94,0.35)] ${
                        index === 0 ? "sm:col-span-2 lg:col-span-2 aspect-[16/10]" : "aspect-[4/5]"
                      }`}
                    >
                      <img
                        src={item.url}
                        alt={item.title}
                        loading="lazy"
                        className="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-108"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-[#090214] via-[#090214]/30 to-transparent opacity-85 group-hover:opacity-95 transition-opacity duration-300" />
                      <div className="absolute bottom-0 inset-x-0 p-5 transform transition-transform duration-300">
                        <span className="inline-block px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 text-xs font-medium mb-1 border border-rose-500/30">
                          {item.title}
                        </span>
                        <p className="text-sm sm:text-base text-rose-100 font-medium leading-relaxed drop-shadow-md">
                          {item.caption}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* Section 4: Sincere Letter in English */}
              <section className="w-full max-w-2xl my-8 p-8 sm:p-10 rounded-3xl bg-gradient-to-b from-[#18092d]/80 to-[#100420]/90 border border-rose-500/30 shadow-[0_0_40px_rgba(244,63,94,0.15)] text-center relative overflow-hidden backdrop-blur-md">
                <div className="absolute -top-12 -right-12 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl pointer-events-none" />

                <h3 className="text-xl sm:text-2xl font-bold text-rose-200 mb-4">
                  A Humble Promise to You
                </h3>
                <p className="text-rose-200/80 leading-relaxed text-sm sm:text-base mb-4 font-light">
                  Whatever mistakes I made, I am deeply and genuinely sorry. Your happiness, your dignity,
                  and your peace of mind mean more to me than anything else in this universe. I promise
                  to honor your feelings, protect your heart, and cherish every single moment with you.
                </p>
                <p className="text-rose-300 font-medium italic text-base">
                  &ldquo;With you, my world is complete. Without you, nothing feels right.&rdquo;
                </p>
              </section>

              {/* Section 5: Closing & Call to Action */}
              <section className="text-center w-full max-w-xl mt-10 flex flex-col items-center">
                <p className="text-rose-300/80 text-sm tracking-widest uppercase font-semibold mb-2">
                  Waiting for you with all my heart
                </p>
                <div className="text-2xl sm:text-3xl font-serif text-rose-200 mb-8 tracking-wide">
                  — aapka Krish
                </div>

                {/* Glowing Rose Pink Button */}
                <button
                  onClick={() => setModalOpen(true)}
                  className="relative group px-10 py-4 rounded-full font-bold text-lg text-white bg-gradient-to-r from-rose-600 via-rose-500 to-pink-600 shadow-[0_0_35px_rgba(244,63,94,0.65)] hover:shadow-[0_0_55px_rgba(244,63,94,0.95)] hover:scale-105 active:scale-95 transition-all duration-300 cursor-pointer border border-rose-300/40"
                >
                  <span className="flex items-center gap-3">
                    <span className="text-xl group-hover:animate-bounce">💌</span>
                    <span>Wapas Aa Jaiye</span>
                    <span className="text-xl group-hover:animate-pulse">✨</span>
                  </span>
                </button>
              </section>
            </main>
          )}

          {/* ================= FULL DIARY NOTE MODAL ================= */}
          {selectedNote && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/85 backdrop-blur-md animate-in fade-in duration-300">
              <div className="relative w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 sm:p-8 rounded-3xl bg-gradient-to-b from-[#1b0833] via-[#120424] to-[#0a0216] border border-rose-500/40 shadow-[0_0_60px_rgba(244,63,94,0.45)] text-left scrollbar-thin scrollbar-thumb-rose-500/30">
                <div className="flex items-start justify-between pb-4 border-b border-rose-500/20 mb-5 gap-4">
                  <div>
                    <span className="text-xs text-rose-400 font-mono tracking-widest uppercase block mb-1">
                      🗓️ Published: {selectedNote.date} • {selectedNote.tag}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold text-rose-100">
                      {selectedNote.title}
                    </h3>
                  </div>
                  <button
                    onClick={() => setSelectedNote(null)}
                    className="w-9 h-9 flex-shrink-0 rounded-full bg-rose-950/70 border border-rose-500/30 text-rose-300 hover:text-white hover:bg-rose-600 flex items-center justify-center text-lg transition-all"
                    aria-label="Close Note"
                  >
                    ✕
                  </button>
                </div>

                {/* Embedded Screenshots / Photos in Modal */}
                {selectedNote.images && selectedNote.images.length > 0 && (
                  <div className="mb-6 p-4 rounded-2xl bg-[#140628]/90 border border-rose-500/30 shadow-lg">
                    <div className="flex items-center justify-between mb-3">
                      <span className="text-xs font-semibold text-rose-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span>📸</span>
                        <span>Attached Pictures & Screenshots ({selectedNote.images.length})</span>
                      </span>
                      <span className="text-[11px] text-rose-400/80 italic">Click any image to enlarge 🔍</span>
                    </div>

                    <div
                      className={`grid gap-3 ${
                        selectedNote.images.length === 1
                          ? "grid-cols-1"
                          : selectedNote.images.length === 2
                          ? "grid-cols-1 sm:grid-cols-2"
                          : "grid-cols-2 sm:grid-cols-3"
                      }`}
                    >
                      {selectedNote.images.map((img, imgIdx) => (
                        <div
                          key={imgIdx}
                          onClick={() => setPreviewImage(img)}
                          className="group/thumb relative rounded-xl overflow-hidden border border-rose-500/30 hover:border-rose-400 bg-black/60 cursor-pointer shadow-md transition-all hover:scale-[1.02] flex flex-col"
                        >
                          <div className="relative w-full h-44 sm:h-52 bg-black/70 flex items-center justify-center overflow-hidden">
                            <img
                              src={img.url}
                              alt={img.caption || `Screenshot ${imgIdx + 1}`}
                              className="w-full h-full object-contain p-1 transition-transform duration-300 group-hover/thumb:scale-105"
                              loading="lazy"
                            />
                            <div className="absolute inset-0 bg-black/40 opacity-0 group-hover/thumb:opacity-100 transition-opacity flex items-center justify-center">
                              <span className="px-3 py-1.5 rounded-full bg-rose-600/90 text-white text-xs font-semibold shadow-lg flex items-center gap-1.5">
                                <span>🔍</span> Click to Enlarge
                              </span>
                            </div>
                          </div>
                          {img.caption && (
                            <div className="p-2.5 bg-[#0e031c] border-t border-rose-500/20 text-[11px] text-rose-200/90 font-medium leading-tight">
                              {img.caption}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Note Full Text */}
                <div className="text-rose-100/95 text-sm sm:text-base leading-relaxed font-light whitespace-pre-line space-y-4 pr-1 selection:bg-rose-500/40 selection:text-white bg-black/20 p-5 rounded-2xl border border-rose-500/15">
                  {selectedNote.content}
                </div>

                <div className="mt-8 pt-4 border-t border-rose-500/20 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <span className="text-xs text-rose-400/70 font-serif italic">
                    From Krish's private journal notes • September & October 2026
                  </span>
                  <button
                    onClick={() => setSelectedNote(null)}
                    className="px-6 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-medium text-xs sm:text-sm transition-all shadow-md active:scale-95"
                  >
                    Close Note 🌹
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= FULLSCREEN LIGHTBOX MODAL ================= */}
          {previewImage && (
            <div
              className="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-6 bg-black/95 backdrop-blur-xl animate-in fade-in duration-200"
              onClick={() => setPreviewImage(null)}
            >
              <div
                className="relative max-w-4xl w-full max-h-[94vh] flex flex-col items-center justify-center"
                onClick={(e) => e.stopPropagation()}
              >
                <button
                  onClick={() => setPreviewImage(null)}
                  className="absolute -top-11 right-0 text-white hover:text-rose-300 bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 border border-white/20 shadow-md"
                  aria-label="Close Lightbox"
                >
                  <span>Close View</span>
                  <span>✕</span>
                </button>

                <div className="relative overflow-hidden rounded-2xl border border-rose-500/40 shadow-[0_0_60px_rgba(244,63,94,0.4)] max-h-[80vh] flex items-center justify-center bg-black/90 p-2">
                  <img
                    src={previewImage.url}
                    alt={previewImage.caption || "Fullscreen preview"}
                    className="max-w-full max-h-[76vh] object-contain rounded-lg"
                  />
                </div>

                {previewImage.caption && (
                  <p className="mt-3 text-center text-xs sm:text-sm text-rose-200 font-medium bg-[#160829]/95 px-5 py-2 rounded-full border border-rose-500/30 max-w-2xl shadow-lg">
                    {previewImage.caption}
                  </p>
                )}
              </div>
            </div>
          )}

          {/* Heartfelt Confirmation Modal */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all">
              <div className="relative w-full max-w-md p-8 sm:p-9 rounded-3xl bg-gradient-to-b from-[#1c0a36] to-[#0c0317] border border-rose-500/50 shadow-[0_0_60px_rgba(244,63,94,0.5)] text-center animate-in fade-in zoom-in-95 duration-300">
                <div className="text-5xl mb-4 animate-bounce">💖</div>
                <h4 className="text-2xl font-bold text-rose-100 mb-3">
                  Thank You, Akanksha!
                </h4>
                <p className="text-rose-200/90 text-sm sm:text-base leading-relaxed mb-6 font-light">
                  Every breath, every prayer, and every dream of mine waits only for you.
                  Krish was yours, is yours, and will always be yours forever.
                </p>
                <button
                  onClick={() => setModalOpen(false)}
                  className="w-full py-3 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-semibold transition-all shadow-[0_0_20px_rgba(244,63,94,0.5)] active:scale-95"
                >
                  With All My Love 🌹
                </button>
              </div>
            </div>
          )}

          {/* Subtle Footer */}
          <footer className="relative z-20 text-center py-6 text-xs text-rose-400/40">
            Created by Krish with utmost love, sincerity, and hope.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ApologyWebsite />);
  </script>
</body>
</html>
